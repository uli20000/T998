<header><div class="topline"><div class="brand">KFC DELIVERY CENTER｜T998</div><a class="back" href="admin.html">返回後台</a></div><h1>營運分析儀表板</h1><div class="subtitle">成績追蹤與因素分析</div></header>
<div class="wrap"><main>
<div id="authMessage" class="panel hidden"></div>
<div id="dashboard" class="hidden">

  </div>

  <div id="status" class="period-status" role="status"></div>

      </footer>
