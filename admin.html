<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>KFC｜台南-T998 巡檢後台</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --red:#c8102e;
  --black:#242424;
  --gray:#77736d;
  --linen:#f4f0e8;
  --paper:#fff;
  --line:#ddd8ce;
  --green:#356b4b;
  --green-bg:#eef5f0;
  --danger:#b42318;
  --danger-bg:#fff0ee;
  --yellow:#9a6b00;
  --yellow-bg:#fff8df;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--linen);
  color:var(--black);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
  text-align:center
}

button,input,textarea{font-family:inherit}
button{cursor:pointer}

.page{
  max-width:900px;
  margin:auto;
  padding-bottom:50px
}

.header{
  background:#fff;
  padding:30px 20px 26px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  color:var(--gray);
  font-size:12px;
  letter-spacing:4px;
  margin-bottom:8px
}

.title-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px
}

.title{
  margin:0;
  font-size:34px;
  font-weight:800
}

.kfc{
  color:var(--red);
  font-size:28px;
  font-weight:900
}

.date{
  margin-top:10px;
  color:var(--gray);
  font-size:14px
}

.section{
  padding:22px 16px 0
}

.section-title{
  margin-bottom:14px;
  font-size:20px;
  font-weight:800
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.summary-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 8px
}

.summary-card.clickable{
  cursor:pointer
}

.summary-label{
  color:var(--gray);
  font-size:13px;
  margin-bottom:8px
}

.summary-number{
  font-size:30px;
  font-weight:800
}

.summary-card.done .summary-number{
  color:var(--green)
}

.summary-card.abnormal .summary-number{
  color:var(--danger)
}

.search-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px
}

.search-input{
  width:100%;
  height:54px;
  border:2px solid #d8d3ca;
  border-radius:14px;
  padding:0 16px;
  font-size:18px;
  text-align:center;
  outline:none
}

.search-input:focus{
  border-color:var(--red)
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}

.action-btn{
  height:48px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
  font-size:15px;
  font-weight:800
}

.action-btn.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#e7b7b2
}

.vehicle-list{
  display:flex;
  flex-direction:column;
  gap:8px
}

.vehicle-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  cursor:pointer
}

.vehicle-card.has-unresolved{
  border:2px solid var(--danger);
  background:#fffafa
}

.vehicle-card.oil-warning{
  border:2px solid #e1c66e;
  background:#fffdf5
}

.vehicle-card.oil-danger{
  border:2px solid #d9958d;
  background:#fffafa
}

.vehicle-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px
}

.plate{
  font-size:20px;
  font-weight:800;
  letter-spacing:1px
}

.center{
  font-size:13px;
  color:var(--gray);
  font-weight:700
}

.status,
.oil-status{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  padding:5px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:800
}

.status-normal,
.oil-normal{
  background:var(--green-bg);
  color:var(--green)
}

.status-abnormal,
.oil-danger{
  background:var(--danger-bg);
  color:var(--danger)
}

.status-none,
.oil-none{
  background:#f1eee8;
  color:var(--gray)
}

.oil-warning{
  background:var(--yellow-bg);
  color:var(--yellow)
}

.vehicle-card.claim-pending{
  border:2px solid #6f9b7a;
  background:#f7fbf8
}

.claim-pending-badge{
  padding:5px 10px;
  border-radius:20px;
  background:var(--green-bg);
  color:var(--green);
  font-size:12px;
  font-weight:800
}

.unresolved-badge{
  padding:5px 10px;
  border-radius:20px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:12px;
  font-weight:800
}

.priority-badge{
  padding:4px 10px;
  border-radius:20px;
  background:var(--danger);
  color:#fff;
  font-size:11px;
  font-weight:800
}

.vehicle-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  margin-top:10px;
  gap:5px;
  color:var(--gray);
  font-size:13px
}

.vehicle-info>div{
  padding:5px 3px
}

.vehicle-info strong{
  display:block;
  margin-top:3px;
  color:var(--black);
  font-size:14px
}

.claim-info{
  grid-column:1 / -1;
  padding:7px 3px 2px;
  border-top:1px solid var(--line);
  color:var(--gray);
  font-size:12px;
  line-height:1.6
}

.claim-info strong{
  display:inline;
  margin:0 12px 0 4px;
  color:var(--black);
  font-size:13px
}

.empty,
.loading{
  padding:40px 20px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  color:var(--gray)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:1000
}

.modal.show{
  display:flex
}

.modal-content{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:25px 25px 0 0;
  padding:24px 18px 35px
}

.modal-title{
  font-size:25px;
  font-weight:800
}

.modal-subtitle{
  color:var(--gray);
  margin-top:5px;
  font-size:14px
}

.quick-list,
.history{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px
}

.quick-item,
.history-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  background:#faf9f6
}

.quick-item{
  cursor:pointer
}

.quick-plate{
  font-size:21px;
  font-weight:800
}

.quick-center{
  margin-top:5px;
  color:var(--gray);
  font-size:14px
}

.quick-detail{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#fff;
  color:var(--gray);
  font-size:14px;
  line-height:1.6
}

.health-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line)
}

.health-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:12px
}

.health-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.health-item{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 8px
}

.health-label{
  color:var(--gray);
  font-size:12px
}

.health-value{
  margin-top:5px;
  font-size:15px;
  font-weight:800
}

.oil-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line)
}

.oil-panel-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px
}

.oil-panel-info{
  color:var(--gray);
  font-size:14px;
  line-height:1.8
}

'.oil-panel-status{
  margin-top:10px;
  font-size:17px;
  font-weight:800
}

.claim-panel{
  margin-top:18px;
  padding:18px;
  border-radius:18px;
  background:#faf9f6;
  border:1px solid var(--line)
}

.claim-panel-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:10px
}

.claim-summary{
  color:var(--gray);
  font-size:14px;
  line-height:1.7;
  margin-bottom:12px
}

.claim-card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  background:#fff;
  margin-top:10px
}

.claim-card:first-child{
  margin-top:0
}

.claim-time{
  font-size:13px;
  color:var(--gray);
  margin-bottom:7px
}

.claim-person{
  font-size:17px;
  font-weight:800
}

.claim-detail{
  margin-top:8px;
  color:var(--gray);
  font-size:14px;
  line-height:1.8
}

.oil-action,
.resolve-btn,
.close-btn{
  width:100%;
  height:50px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  color:#fff;
  font-size:16px;
  font-weight:800
}

.oil-action{
  background:var(--red)
}

.resolve-btn{
  background:var(--green)
}

.close-btn{
  height:52px;
  background:var(--black)
}

.history-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px
}

.history-date{
  font-size:14px;
  color:var(--gray)
}

.history-mileage{
  margin-top:12px;
  font-size:18px;
  font-weight:800
}

.history-normal{
  margin-top:10px;
  padding:10px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  font-weight:700
}

.history-abnormal{
  margin-top:10px;
  padding:12px;
  border-radius:11px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap
}

.unresolved-box{
  margin-top:12px;
  padding:14px;
  border-radius:12px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:14px;
  line-height:1.7
}

.resolution-note{
  width:100%;
  min-height:90px;
  margin-top:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  resize:vertical;
  text-align:center;
  font-size:15px;
  outline:none
}

.resolved-box{
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:var(--green-bg);
  color:var(--green);
  font-size:14px;
  line-height:1.8
}

@media(max-width:700px){
  .summary{
    grid-template-columns:repeat(2,1fr);
    gap:8px
  }

  .summary-card:first-child{
    grid-column:auto
  }

  .summary-card{
    padding:14px 6px;
    border-radius:16px
  }

  .summary-label{
    font-size:12px;
    margin-bottom:6px
  }

  .summary-number{
    font-size:25px
  }

  .title{
    font-size:28px
  }

  .kfc{
    font-size:24px
  }

  .action-row{
    grid-template-columns:1fr
  }

  .vehicle-list{
    gap:7px
  }

  .vehicle-card{
    padding:12px;
    border-radius:15px
  }

  .vehicle-top{
    gap:5px
  }

  .plate{
    font-size:19px
  }

  .vehicle-info{
    margin-top:8px;
    font-size:12px
  }

  .vehicle-info strong{
    font-size:13px
  }
}


.admin-menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:20px 16px 0;
}

.admin-mode-btn{
  min-height:110px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.035);
  font-size:18px;
  font-weight:800;
}

.admin-mode-btn .icon{
  display:block;
  font-size:32px;
  margin-bottom:8px;
}

.admin-mode-page{display:none}

.card-abnormal-text{
  max-width:100%;
  margin-top:6px;
  color:var(--danger);
  font-size:12px;
  line-height:1.45;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.resolved-detail{
  margin-top:10px;
  padding:9px 11px;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  font-size:12px;
  line-height:1.65;
}

.resolved-detail summary{
  cursor:pointer;
  font-weight:800;
}

.survey-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.summary-with-refresh{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:14px;
}

.summary-with-refresh .survey-summary{
  display:contents;
}

.summary-refresh-btn{
  width:100%;
  min-height:92px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  color:var(--black);
  font:inherit;
  font-weight:800;
  cursor:pointer;
}

.summary-refresh-btn:hover{
  border-color:#c9a99e;
}

@media(max-width:700px){
  .summary-with-refresh{
    grid-template-columns:repeat(2,1fr);
  }
}

.survey-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  text-align:left;
}

.survey-card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.survey-name{font-size:18px;font-weight:800}
.survey-time{color:var(--gray);font-size:12px}
.survey-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:700px){.survey-grid{grid-template-columns:1fr}.survey-card-top{align-items:flex-start;flex-direction:column;gap:4px}.survey-name{font-size:17px}.record-actions{display:grid;grid-template-columns:1fr;gap:8px}.record-actions .action-btn{width:100%}}
.survey-item{padding:9px;border-radius:10px;background:#faf9f6;color:var(--gray);font-size:13px;line-height:1.5}
.survey-item strong{display:block;color:var(--black);font-size:15px}
.survey-result-pass{color:var(--green)!important}
.survey-result-fail{color:var(--danger)!important}
.survey-detail{margin-top:10px;color:var(--gray);font-size:13px;line-height:1.6}
.survey-status-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 14px}
.survey-status-heading{grid-column:1/-1;text-align:left;color:var(--gray);font-size:13px}
.survey-status-card{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;font:inherit;color:var(--black);cursor:pointer}
.survey-status-card:hover{border-color:#c9a99e}
.survey-status-card .status-name{font-size:16px;font-weight:800}
.survey-status-card .status-meta{margin-top:5px;color:var(--gray);font-size:12px;line-height:1.55}
.survey-status-card .status-result{margin-top:5px;font-size:13px;font-weight:800}
.status-card-actions{display:flex;justify-content:flex-end;margin-top:10px}
.status-delete-btn{border:1px solid #e2aaa4;background:var(--danger-bg);color:var(--danger);border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.defensive-status-list{display:flex;flex-direction:column;gap:8px}
.defensive-status-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.defensive-status-card .status-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.defensive-status-card .status-meta{margin-top:7px;color:var(--gray);font-size:13px;line-height:1.55}
.survey-status-card .status-pass{color:var(--green)}
.survey-status-card .status-fail{color:var(--danger)}
.survey-summary .summary-card.active{border:2px solid var(--red);background:#fff8f8}
.summary-card{font:inherit;color:var(--black)}
.record-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.record-actions .action-btn{width:auto;min-width:104px;padding:9px 12px;font-size:13px}
.record-actions .delete-btn{background:var(--danger-bg);border:1px solid #e2aaa4;color:var(--danger);cursor:pointer;border-radius:10px;font:inherit;font-weight:800;padding:9px 12px;min-width:104px}
.mode-tools{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}

@media(max-width:700px){
  .admin-menu{grid-template-columns:1fr}
  .survey-summary{grid-template-columns:repeat(2,1fr)}
}


.mode-back-row{padding:16px 16px 0}
.mode-back-row .action-btn{width:100%}



/* 前後台標題字體統一 */
.title{font-size:30px;line-height:1.2}
@media(max-width:700px){.title{font-size:26px}}



/* 三行標題：城市-Rider Center／KFC／日期 */
.header-row,
.title-row{
  flex-direction:column;
  gap:4px;
}
.title{font-size:30px;line-height:1.2}
.kfc{font-size:26px}
.date{margin-top:4px;font-size:14px}
@media(max-width:700px){.title{font-size:26px}}

/* 後台入口：長條形按鈕與日期 */
.admin-menu{grid-template-columns:1fr;gap:10px;padding:16px}
.admin-mode-btn{min-height:72px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px}
.admin-mode-btn .icon{display:inline-block;font-size:28px;margin:0}
.date{display:block;min-height:20px}

/* 車輛新增、問卷名單與防禦駕駛 */
.vehicle-add-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vehicle-add-grid .action-btn{grid-column:1 / -1;width:100%}
.survey-admin-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.survey-admin-tools .action-btn{width:100%}
.roster-panel{margin-top:14px;text-align:left}
.roster-panel-title{font-weight:800;margin-bottom:8px}
.roster-list{display:grid;gap:8px}
.roster-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#faf9f6;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.roster-item button{border:1px solid #e2aaa4;background:var(--danger-bg);color:var(--danger);border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}
.defensive-admin-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;margin-bottom:10px}
.defensive-admin-card .status-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.defensive-admin-card .answer-line{color:var(--gray);font-size:13px;line-height:1.6;margin-top:8px}
@media(max-width:700px){.vehicle-add-grid,.survey-admin-tools{grid-template-columns:1fr}}
@media(max-width:700px){.survey-status-list{grid-template-columns:1fr}}
/* 新人名單：批次、姓名、新增同一列 */
.survey-admin-tools{max-width:620px;margin:10px auto 0;grid-template-columns:112px minmax(0,1fr) auto;align-items:center}
.survey-admin-tools .search-input{height:42px;padding:8px 10px;font-size:14px}
.survey-admin-tools .action-btn{width:auto;min-height:42px;padding:8px 12px;white-space:nowrap;font-size:14px}
@media(max-width:700px){.survey-admin-tools{grid-template-columns:1fr}.survey-admin-tools .action-btn{width:100%}}

/* 管理員登入：手機優先、簡潔品牌卡片 */
.auth-gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;position:relative;overflow:hidden;background:#f4f0e8}
.auth-gate::before,.auth-gate::after{content:"";position:absolute;border-radius:999px;pointer-events:none}
.auth-gate::before{width:420px;height:420px;right:-180px;top:-170px;background:rgba(200,16,46,.08)}
.auth-gate::after{width:340px;height:340px;left:-180px;bottom:-190px;background:rgba(200,16,46,.06)}
.auth-card{width:min(100%,460px);position:relative;z-index:1;background:rgba(255,255,255,.96);border:1px solid rgba(36,36,36,.08);border-radius:30px;padding:28px 30px 26px;box-shadow:0 20px 60px rgba(36,36,36,.13);text-align:left}
.auth-card::before{content:"";display:block;width:48px;height:5px;margin-bottom:26px;border-radius:999px;background:var(--red)}
.auth-brand{display:flex;align-items:center;gap:9px;color:var(--gray);font-size:11px;font-weight:900;letter-spacing:2.4px;margin-bottom:18px}
.auth-brand-kfc{color:var(--red);font-size:16px;letter-spacing:1px}
.auth-brand-separator{color:#c7c0b6;font-size:16px}
.auth-mark{width:72px;height:72px;margin:0 0 18px;border-radius:22px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 20px rgba(200,16,46,.22)}
.auth-mark span{display:block}
.auth-card h1{margin:0;color:var(--black);font-size:30px;line-height:1.2;letter-spacing:.3px}
.auth-heading{margin-top:7px;color:var(--black);font-size:18px;font-weight:800}
.auth-subtitle{margin:10px 0 26px;color:var(--gray);font-size:14px;line-height:1.65}
.auth-field{text-align:left;margin:16px 0}
.auth-field label{display:block;margin:0 0 8px;font-size:14px;font-weight:900;color:var(--black)}
.auth-input-wrap{position:relative}
.auth-input{width:100%;height:54px;border:1px solid #d8d3ca;border-radius:15px;padding:0 15px;background:#fff;color:var(--black);font-size:16px;outline:none;transition:.2s}
.auth-input::placeholder{color:#aaa}
.auth-input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.10)}
.auth-input.has-toggle{padding-right:68px}
.auth-toggle{position:absolute;right:7px;top:7px;height:40px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--red);font-size:13px;font-weight:900;padding:0 12px;cursor:pointer}
.auth-submit{width:100%;height:56px;margin-top:12px;border:0;border-radius:15px;background:var(--red);color:#fff;font-size:17px;font-weight:900;letter-spacing:.5px;box-shadow:0 10px 22px rgba(200,16,46,.20);cursor:pointer}
.auth-submit:hover{background:#ae0e28}
.auth-submit:disabled{opacity:.6;cursor:wait}
.auth-message{min-height:22px;margin-top:14px;color:var(--danger);font-size:14px;line-height:1.5}
.auth-foot{margin-top:20px;padding-top:16px;border-top:1px solid #eee9e1;color:var(--gray);font-size:12px;line-height:1.5}
.admin-session-bar{display:none;align-items:center;justify-content:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);color:var(--gray);font-size:12px}
.admin-session-bar button{border:1px solid #e2aaa4;background:var(--danger-bg);color:var(--danger);border-radius:9px;padding:6px 10px;font-weight:800}
@media(max-width:500px){.auth-gate{padding:18px 14px}.auth-card{padding:24px 20px 22px;border-radius:26px}.auth-card::before{margin-bottom:22px}.auth-card h1{font-size:27px}.auth-mark{width:66px;height:66px;border-radius:20px}.auth-subtitle{margin-bottom:22px}}


/* 後台首頁與設備管理：手機優先 */
.admin-mode-btn{min-height:84px;font-size:22px}
.admin-mode-btn .icon{font-size:34px}
.device-admin-type-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:620px;margin:0 auto}
.device-admin-type-btn{min-height:58px;border:2px solid var(--line);border-radius:15px;background:#fff;color:var(--black);font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.device-admin-type-btn.active{border-color:var(--red);background:var(--danger-bg);color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.08)}
.device-admin-type-btn:focus-visible{outline:3px solid rgba(22,131,223,.35);outline-offset:2px}
.device-add-panel{border-color:#e1c66e;background:#fffdf5}
.device-add-intro{padding:12px;border-radius:12px;background:var(--yellow-bg);color:#765800;font-size:14px;line-height:1.6;text-align:left;margin-bottom:12px}
@media(max-width:700px){.admin-mode-btn{min-height:82px;font-size:21px}.admin-mode-btn .icon{font-size:32px}}
</style>
</head>

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function fmt(v){

  if(!v)
    return "尚無紀錄";

  const d =
    new Date(v);

  if(Number.isNaN(d.getTime()))
    return "日期錯誤";

  return d.toLocaleString(
    "zh-TW",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function ranges(){

  const n =
    new Date();

  const s =
    new Date(
      n.getFullYear(),
      n.getMonth(),
      n.getDate()
    );

  const e =
    new Date(
      n.getFullYear(),
      n.getMonth(),
      n.getDate()+1
    );

  return {
    s,
    e
  };

}

/* =========================
   車輛詳細頁只顯示最近 5 天
   注意：只限制畫面顯示，不刪除雲端資料
========================= */

function fiveDayCutoff(){

  const n = new Date();

  return new Date(
    n.getFullYear(),
    n.getMonth(),
    n.getDate()-4
  );

}

function isWithinFiveDays(v){

  if(!v)
    return false;

  const t = new Date(v).getTime();
  const cutoff = fiveDayCutoff().getTime();

  return !Number.isNaN(t) && t >= cutoff;

}

/* =========================
   今日巡檢
========================= */

function todayReport(v){
  const rows = todayReports
    .filter(r => r.vehicle_id === v.id)
    .sort((a,b) => new Date(b.reported_at || 0).getTime() - new Date(a.reported_at || 0).getTime());
  return rows[0] || null;
}

/* =========================
   最新巡檢
========================= */

function latestReport(v){

  return latestReports.find(
    r => r.vehicle_id === v.id
  ) || null;

}

/* =========================
   所有未解決異常
   注意：
   只要 abnormal + 尚未 resolved
   不分今天或歷史
========================= */

function unresolvedForVehicle(v){

  return unresolvedReports.filter(
    r => r.vehicle_id === v.id
  );

}

/* =========================
   異常文字
========================= */

function abnormalText(r){

  if(!r?.abnormal_items)
    return "異常未填寫";

  return Array.isArray(r.abnormal_items)
    ? r.abnormal_items.join("、")
    : String(r.abnormal_items);

}

/* =========================
   機油狀態
========================= */

function oilStatus(v){

  const l =
    latestReport(v);

  const cur =
    l ? Number(l.mileage) : null;

  const last =
    v.last_oil_change_mileage != null
      ? Number(v.last_oil_change_mileage)
      : null;

  if(
    last == null ||
    Number.isNaN(last)
  ){

    return {
      type:"none",
      text:"尚未設定換油基準",
      current:cur,
      last:null,
      remaining:null
    };

  }

  if(
    cur == null ||
    Number.isNaN(cur)
  ){

    return {
      type:"none",
      text:"等待里程",
      current:null,
      last,
      remaining:null
    };

  }

  const rem =
    OIL_INTERVAL -
    (cur-last);

  if(rem <= 0){

    return {
      type:"danger",
      text:`需要換油 ${Math.abs(rem)} km`,
      current:cur,
      last,
      remaining:rem
    };

  }

  if(rem <= OIL_WARNING_DISTANCE){

    return {
      type:"warning",
      text:`即將換油，剩餘 ${rem} km`,
      current:cur,
      last,
      remaining:rem
    };

  }

  return {
    type:"normal",
    text:`距離換油剩餘 ${rem} km`,
    current:cur,
    last,
    remaining:rem
  };

}

/* =========================
   領車狀態
========================= */

function latestClaim(v){
  const rows = allClaims
    .filter(r => r.vehicle_id === v.id)
    .sort((a,b) => new Date(b.claimed_at || 0).getTime() - new Date(a.claimed_at || 0).getTime());
  return rows[0] || null;
}

function isClaimPending(v){
  return isClaimedToday(v) && !isReturnedToday(v);
}

/* =========================
   車輛排序

   1. 待處理異常
   2. 已處理異常
   3. 正常
   4. 未檢查
========================= */

function isToday(value){
  if(!value) return false;
  const d = new Date(value);
  const n = new Date();
  return d.getFullYear() === n.getFullYear()
    && d.getMonth() === n.getMonth()
    && d.getDate() === n.getDate();
}

function isClaimedToday(v){
  const claim = latestClaim(v);
  return Boolean(claim && isToday(claim.claimed_at));
}

function isReturnedToday(v){
  const claim = latestClaim(v);
  const report = todayReport(v);
  if(!claim || !report || !isToday(claim.claimed_at)) return false;
  const claimTime = new Date(claim.claimed_at || 0).getTime();
  const reportTime = new Date(report.reported_at || 0).getTime();
  if(!Number.isFinite(claimTime) || !Number.isFinite(reportTime)) return false;
  // 只把最新一次領車之後的巡檢視為這次還車。
  return reportTime > claimTime;
}

function priority(v){
  if(unresolvedForVehicle(v).length) return 1;
  if(isClaimedToday(v) && !isReturnedToday(v)) return 2;
  if(isReturnedToday(v)) return 3;
  return 4;
}

/* =========================
   載入資料
========================= */

async function loadData(){

  vehicleList.innerHTML =
    '<div class="loading">載入資料中…</div>';

  claimLoadError = null;

  try{

    const vr =
      await db
        .from("vehicles")
        .select("*")
        .eq("active",true)
        .order("plate4",{ascending:true});

    if(vr.error)
      throw vr.error;

    vehicles =
      vr.data || [];

    if(!vehicles.length){

      allReports = [];
      todayReports = [];
      latestReports = [];
      unresolvedReports = [];
      allClaims = [];

      updateSummary();
      renderVehicles();

      return;

    }

    const ids =
      vehicles.map(v => v.id);

    const rr =
      await db
        .from("inspection_reports")
        .select("*")
        .in("vehicle_id",ids)
        .order("reported_at",{ascending:false});

    if(rr.error)
      throw rr.error;

    allReports =
      rr.data || [];

    const {s,e} =
      ranges();

    todayReports =
      allReports.filter(r => {

        const t =
          new Date(r.reported_at).getTime();

        return (
          t >= s.getTime() &&
          t < e.getTime()
        );

      });

    /* 最新一筆巡檢 */

    const lm =
      new Map();

    allReports.forEach(r => {

      if(!lm.has(r.vehicle_id))
        lm.set(r.vehicle_id,r);

    });

    latestReports =
      [...lm.values()];

    /* 所有未解決異常 */

    unresolvedReports =
      allReports.filter(r => {

        return (
          r.overall_status === "abnormal" &&
          r.resolution_status !== "resolved"
        );

      });

    /*
      領車資料獨立讀取：
      claim_records 讀取失敗時，
      不讓整個後台跟著顯示資料讀取失敗。
    */

    const cr =
      await db
        .from("claim_records")
        .select("*")
        .in("vehicle_id",ids)
        .order("claimed_at",{ascending:false});

    if(cr.error){

      console.warn(
        "領車紀錄讀取失敗：",
        cr.error
      );

      allClaims = [];
      claimLoadError = cr.error;

    }
    else{

      allClaims =
        cr.data || [];

    }

    updateSummary();
    renderVehicles();

  }
  catch(e){

    console.error(e);

    vehicleList.innerHTML =
      `
      <div class="empty">

        <strong>資料讀取失敗</strong>

        <br><br>

        ${esc(e.message || "未知錯誤")}

      </div>
      `;

  }

}

function updateSummary(){
  const unresolvedVehicleIds = new Set(
    unresolvedReports.map(r => r.vehicle_id)
  );

  totalCount.textContent = vehicles.length;
  // 已領車只計算「今天已領、目前尚未還車」的車輛
  claimedCount.textContent = vehicles.filter(isClaimPending).length;
  returnedCount.textContent = vehicles.filter(isReturnedToday).length;
  unresolvedCount.textContent = unresolvedVehicleIds.size;
}

========================= */

function openQuickList(type){

  let list = [];

  if(type === "claimed"){

    list =
      vehicles.filter(isClaimPending);

    quickModalTitle.textContent =
      "已領車｜尚未還車";

  }
  else if(type === "returned"){

    list =
      vehicles.filter(isReturnedToday);

    quickModalTitle.textContent =
      "已領車｜已還車";

  }
  else if(type === "pending"){

    list =
      vehicles.filter(
        v => !todayReport(v)
      );

    quickModalTitle.textContent =
      "尚未巡檢車輛";

  }
  else{

    /*
      現在只有一種異常清單：
      所有尚未解決異常
    */

    const ids =
      new Set(
        unresolvedReports.map(
          r => r.vehicle_id
        )
      );

    list =
      vehicles.filter(
        v => ids.has(v.id)
      );

    quickModalTitle.textContent =
      "待處理異常車輛";

  }

  quickModalSubtitle.textContent =
    `共 ${list.length} 台｜點選車輛查看詳細紀錄`;

  quickList.innerHTML = "";

  if(!list.length){

    quickList.innerHTML =
      '<div class="empty">目前沒有符合資料</div>';

  }
  else{

    list.forEach(v => {

      const l =
        latestReport(v);

      const u =
        unresolvedForVehicle(v)[0];

      const o =
        oilStatus(v);

      const claim =
        latestClaim(v);

      let detail;

      if(type === "unresolved" && u){

        detail =
          `
          🔴 ${esc(abnormalText(u))}

          <br>

          發生時間：
          ${esc(fmt(u.reported_at))}

          <br>

          里程：
          ${Number(u.mileage || 0).toLocaleString()} km
          `;

      }
      else{

        detail =
          `
          最新里程：
          ${
            l
              ? Number(l.mileage).toLocaleString()+" km"
              : "尚無紀錄"
          }

          <br>

          ${esc(o.text)}

          <br>

          最新領車人：${esc(claim?.claimant_name || "尚無紀錄")}

          <br>

          領車時間：${esc(claim ? fmt(claim.claimed_at) : "尚無紀錄")}
          `;

      }

      const item =
        document.createElement("div");

      item.className =
        "quick-item";

      item.innerHTML =
        `

        <div class="quick-plate">
          ${esc(v.full_plate || v.plate4)}
        </div>

        <div class="quick-center">
          CENTER｜${esc(v.center || "未設定")}
        </div>
        ${v.employee_name ? `<div class="quick-center">員工｜${esc(v.employee_name)}</div>` : ""}

        <div class="quick-detail">
          ${detail}
        </div>

        `;

      item.onclick =
        () => {

          quickModal.classList.remove("show");

          openHistory(v);

        };

      quickList.appendChild(item);

    });

  }

  quickModal.classList.add("show");

}

/* =========================
   車輛歷史
========================= */

async function openHistory(v){

  modal.classList.add("show");

  modalTitle.textContent =
    v.full_plate || v.plate4 || "車輛";

  modalSubtitle.textContent =
    `CENTER｜${v.center || "未設定"}`;

  renderOilPanel(v);
  renderOilHistory(v);
  renderClaimHistory(v);

  healthPanel.innerHTML =
    '<div class="loading">讀取車輛健康資料中…</div>';

  historyContainer.innerHTML =
    '<div class="loading">讀取歷史紀錄中…</div>';

  try{

    const r =
      await db
        .from("inspection_reports")
        .select("*")
        .eq("vehicle_id",v.id)
        .order("reported_at",{ascending:false});

    if(r.error)
      throw r.error;

    const allVehicleReports =
      r.data || [];

    renderHealthPanel(
      v,
      allVehicleReports
    );

    // 一般歷史只顯示最近 5 天；但所有尚未解決的異常，
    // 不論發生多久都必須保留顯示，才能直接完成結案。
    const reports =
      allVehicleReports.filter(report =>
        isWithinFiveDays(report.reported_at) ||
        (
          report.overall_status === "abnormal" &&
          report.resolution_status !== "resolved"
        )
      );

    historyContainer.innerHTML =
      "";

    if(!reports.length){

      historyContainer.innerHTML =
        `
        <div class="empty">
          最近 5 天尚無巡檢紀錄
          <br><br>
          <span style="font-size:13px">超過 5 天的原始資料仍保存在雲端，可由月份匯出查看</span>
        </div>
        `;

      return;

    }

    const historyNote =
      document.createElement("div");

    historyNote.className = "empty";
    historyNote.style.padding = "16px";
    historyNote.style.fontSize = "13px";
    historyNote.textContent = "巡檢紀錄顯示最近 5 天，以及所有尚未解決異常｜更早且已解決資料可由月份匯出查看";
    historyContainer.appendChild(historyNote);

    reports.forEach(report => {

      const card =
        document.createElement("div");

      const bad =
        report.overall_status === "abnormal";

      card.className =
        "history-card";

      card.innerHTML =
        `

        <div class="history-top">

          <div class="history-date">
            ${esc(fmt(report.reported_at))}
          </div>

          <div class="status ${
            bad
              ? "status-abnormal"
              : "status-normal"
          }">

            ${
              bad
                ? "異常"
                : "正常"
            }

          </div>

        </div>

        <div class="history-mileage">

          里程：
          ${Number(report.mileage || 0).toLocaleString()}
          km

        </div>

        ${
          bad
            ? renderAbnormal(report)
            : `
              <div class="history-normal">
                本次巡檢全部正常
              </div>
            `
        }

        `;

      historyContainer.appendChild(card);

    });

  }
  catch(e){

    healthPanel.innerHTML = "";

    historyContainer.innerHTML =
      `
      <div class="empty">

        歷史紀錄讀取失敗

        <br><br>

        ${esc(e.message || "未知錯誤")}

      </div>
      `;

  }

}

  ){

    return `

        <div class="history-abnormal">

/* =========================
   標記異常已解決
========================= */

async function resolveReport(id){

  const el =
    $("note-"+id);

  const note =
    el
      ? el.value.trim()
      : "";

  if(
    !confirm(
      "確認這筆異常已經處理完成嗎？"
    )
  )
    return;

  try{

    const r =
      await db
        .from("inspection_reports")
        .update({
          resolution_status:"resolved",
          resolved_at:new Date().toISOString(),
          resolution_note:
            note || null
        })
        .eq("id",id);

    if(r.error)
      throw r.error;

    alert(
      "✅ 已標記為解決"
    );

    await loadData();

    const report =
      allReports.find(
        x => x.id === id
      );

    if(report){

      const v =
        vehicles.find(
          x => x.id === report.vehicle_id
        );

      if(v)
        await openHistory(v);

    }

  }
  catch(e){

    alert(
      "更新失敗：\n" +
      (e.message || "未知錯誤")
    );

  }

}

/* =========================
   確認換油
========================= */

async function confirmOilChange(id){

  const v =
    vehicles.find(
      x => x.id === id
    );

  const l =
    v
      ? latestReport(v)
      : null;

  if(!v || !l){

    alert(
      "這台車目前沒有巡檢里程，無法設定換油基準。"
    );

    return;

  }

  const m =
    Number(l.mileage || 0);

  if(
    !confirm(
      `
確認已更換機油？

CENTER：
${v.center || "未設定"}

目前里程：
${m.toLocaleString()} km

系統會以
${m.toLocaleString()} km
作為新的換油基準。
      `
    )
  )
    return;

  try{

    const record =
      await db.rpc("record_oil_change",{
        p_vehicle_id:id,
        p_mileage:m,
        p_changed_at:new Date().toISOString()
      });

    if(record.error)
      throw record.error;

    v.last_oil_change_mileage =
      m;

    renderOilPanel(v);
    await renderOilHistory(v);
    renderVehicles();

    alert(
      `
完成！

下一次換油里程：
${(m + OIL_INTERVAL).toLocaleString()} km
      `
    );

  }
  catch(e){

    alert(
      "更新失敗：\n" +
      (e.message || "未知錯誤")
    );

  }

}

/* =========================
   清理 2 個月以前資料
========================= */

async function cleanupOldReports(){

  const cutoff =
    new Date();

  cutoff.setMonth(
    cutoff.getMonth()-2
  );

  try{

    cleanupBtn.disabled = true;

    cleanupBtn.textContent =
      "🗑️ 查詢中…";

    const check =
      await db
        .from("inspection_reports")
        .select(
          "id",
          {
            count:"exact",
            head:true
          }
        )
        .lt(
          "reported_at",
          cutoff.toISOString()
        );

    if(check.error)
      throw check.error;

    const count =
      check.count || 0;

    if(!count){

      alert(
        "目前沒有 2 個月以前的巡檢資料。"
      );

      return;

    }

    if(
      !confirm(
        `
即將刪除 ${count} 筆巡檢資料。

範圍：
${cutoff.toLocaleDateString("zh-TW")} 以前

⚠️ 只會刪除巡檢紀錄。
不會刪除車輛資料。
也不會刪除換油基準。

確定要刪除嗎？
        `
      )
    )
      return;

    cleanupBtn.textContent =
      "🗑️ 清理中…";

    const rpc =
      await db.rpc(
        "cleanup_old_inspection_reports"
      );

    if(rpc.error)
      throw rpc.error;

    const deleted =
      rpc.data?.deleted_count ?? count;

    alert(
      `
✅ 清理完成！

已刪除 ${deleted} 筆巡檢資料。
      `
    );

    await loadData();

  }
  catch(e){

    alert(
      "清理失敗：\n" +
      (e.message || "未知錯誤")
    );

  }
  finally{

    cleanupBtn.disabled = false;

    cleanupBtn.textContent =
      "🗑️ 清理 2 個月前資料";

  }

}

/* =========================
   月份 Excel 匯出
========================= */

async function exportMonthlyExcel(){

  const month = exportMonth.value;

  if(!month){
    alert("請先選擇月份。");
    return;
  }

  const [year,monthNo] = month.split("-").map(Number);
  const start = new Date(year,monthNo-1,1);
  const end = new Date(year,monthNo,1);

  exportExcelBtn.disabled = true;
  exportExcelBtn.textContent = "📊 匯出中…";

  try{
    const vr = await db
      .from("vehicles")
      .select("id,plate4,full_plate,center");

    if(vr.error)
      throw vr.error;

    const vehicleMap = new Map(
      (vr.data || []).map(v => [v.id,v])
    );

    const rr = await db
      .from("inspection_reports")
      .select("*")
      .gte("reported_at",start.toISOString())
      .lt("reported_at",end.toISOString())
      .order("reported_at",{ascending:true})
      .range(0,9999);

    if(rr.error)
      throw rr.error;

    const or = await db
      .from("oil_change_records")
      .select("*")
      .gte("changed_at",start.toISOString())
      .lt("changed_at",end.toISOString())
      .order("changed_at",{ascending:true})
      .range(0,9999);

    if(or.error)
      throw or.error;

    const cr =
      await db
        .from("claim_records")
        .select("*")
        .gte("claimed_at",start.toISOString())
        .lt("claimed_at",end.toISOString())
        .order("claimed_at",{ascending:true})
        .range(0,9999);

    if(cr.error)
      throw cr.error;

    const reportRows = (rr.data || []).map(r => {
      const v = vehicleMap.get(r.vehicle_id) || {};
      return {
        "日期":r.reported_at ? new Date(r.reported_at).toLocaleDateString("zh-TW") : "",
        "時間":r.reported_at ? new Date(r.reported_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}) : "",
        "車牌":v.full_plate || v.plate4 || "",
        "CENTER":v.center || "",
        "里程":r.mileage ?? "",
        "引擎發動":r.engine_start || "",
        "前輪胎紋":r.front_tire || "",
        "前輪胎壓":r.front_tire_pressure || "",
        "後輪胎紋":r.rear_tire || "",
        "後輪胎壓":r.rear_tire_pressure || "",
        "前剎車":r.front_brake || "",
        "後剎車":r.rear_brake || "",
        "大燈":r.headlight || "",
        "剎車燈":r.brake_light || "",
        "其他":r.other || "",
        "舊版機油燈":r.oil_light || "",
        "舊版煞車":r.brake || "",
        "整體狀態":r.overall_status === "abnormal" ? "異常" : "正常",
        "異常項目":Array.isArray(r.abnormal_items) ? r.abnormal_items.join("、") : (r.abnormal_items || ""),
        "處理狀態":r.resolution_status === "resolved" ? "已處理" : (r.overall_status === "abnormal" ? "待處理" : "-"),
        "處理時間":r.resolved_at ? fmt(r.resolved_at) : "",
        "處理備註":r.resolution_note || ""
      };
    });

    const oilRows = (or.data || []).map(r => {
      const v = vehicleMap.get(r.vehicle_id) || {};
      return {
        "日期":r.changed_at ? new Date(r.changed_at).toLocaleDateString("zh-TW") : "",
        "時間":r.changed_at ? new Date(r.changed_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}) : "",
        "車牌":v.full_plate || v.plate4 || "",
        "CENTER":v.center || "",
        "換油里程":r.mileage ?? "",
        "備註":r.note || ""
      };
    });

    const claimRows =
      (cr.data || []).map(r => {

        const v =
          vehicleMap.get(r.vehicle_id) || {};

        return {
          "日期":r.claimed_at ? new Date(r.claimed_at).toLocaleDateString("zh-TW") : "",
          "時間":r.claimed_at ? new Date(r.claimed_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}) : "",
          "車牌":v.full_plate || v.plate4 || "",
          "CENTER":v.center || "",
          "領車人":r.claimant_name || "",
          "領車點":r.claim_point || "",
          "記錄器號碼":r.recorder_number || "",
          "油卡狀態":r.oil_card_status || ""
        };

      });

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(reportRows);
    const ws2 = XLSX.utils.json_to_sheet(oilRows);
    const ws3 = XLSX.utils.json_to_sheet(claimRows);
    XLSX.utils.book_append_sheet(wb,ws1,"巡檢紀錄");
    XLSX.utils.book_append_sheet(wb,ws2,"換油紀錄");
    XLSX.utils.book_append_sheet(wb,ws3,"領車紀錄");

    XLSX.writeFile(
      wb,
      `KFC車輛巡檢_${month}.xlsx`
    );

    alert(`✅ 匯出完成！\n\n巡檢紀錄：${reportRows.length} 筆\n換油紀錄：${oilRows.length} 筆\n領車紀錄：${claimRows.length} 筆`);
  }
  catch(e){
    alert(
      "匯出失敗：\n" +
      (e.message || "未知錯誤")
    );
  }
  finally{
    exportExcelBtn.disabled = false;
    exportExcelBtn.textContent = "📊 匯出 Excel";
  }
}

function parseSurveyPart(value){

  try { return JSON.parse(value); } catch(e) { return {}; }
}

function surveyResultClass(value){

}

function renderSurveySummary(){
  const targetNameSet = new Set(surveyTargets.map(x => String(x.respondent_name || "").trim()).filter(Boolean));
  const completedNames = new Set(surveyResponses.map(x => String(x.respondent_name || "").trim()).filter(name => targetNameSet.has(name)));
  const incomplete = surveyTargets.filter(x => !completedNames.has(String(x.respondent_name || "").trim())).length;
  const failed = surveyResponses.filter(x => x.part1_result === "不合格" || x.part2_result === "不合格").length;
  surveySummary.innerHTML = `
    <button type="button" class="summary-card clickable" data-survey-status="required"><div class="summary-label">應完成</div><div class="summary-number">${surveyTargets.length}</div></button>
    <button type="button" class="summary-card abnormal clickable" data-survey-status="incomplete"><div class="summary-label">未完成</div><div class="summary-number">${incomplete}</div></button>
    <button type="button" class="summary-card done clickable" data-survey-status="completed"><div class="summary-label">已完成</div><div class="summary-number">${completedNames.size}</div></button>
  `;
  surveySummary.querySelectorAll("[data-survey-status]").forEach(card => {
    card.classList.toggle("active", card.dataset.surveyStatus === activeSurveyStatus);
  });
  renderSurveyStatusList(activeSurveyStatus);
}

function latestSurveyResponseByName(){
  const map = new Map();
  surveyResponses.forEach(row => {
    const name = String(row.respondent_name || "").trim();
    if(!name) return;
    if(!map.has(name)) map.set(name, row);
  });
  return map;
}

function renderSurveyStatusList(status){
  activeSurveyStatus = status || "required";
  const responseMap = latestSurveyResponseByName();
  const keyword = surveySearchInput ? surveySearchInput.value.trim().toLowerCase() : "";
  const targetRows = surveyTargets.map(row => {
    const name = String(row.respondent_name || "").trim();
    return {name, round: row.survey_round || surveyRoundSelect.value, response: responseMap.get(name) || null};
  }).filter(row => row.name && (!keyword || row.name.toLowerCase().includes(keyword)));
  let rows = targetRows;
  let title = "應完成名單";
  if(activeSurveyStatus === "incomplete"){
    rows = targetRows.filter(row => !row.response);
    title = "未完成名單";
  }else if(activeSurveyStatus === "completed"){
    rows = targetRows.filter(row => row.response);
    title = "已完成名單";
  }else if(activeSurveyStatus === "failed"){
    rows = targetRows.filter(row => row.response && (row.response.part1_result === "不合格" || row.response.part2_result === "不合格"));
    title = "不合格名單";
  }
  if(!rows.length){
    surveyStatusList.innerHTML = `<div class="survey-status-heading">${title}（0 人）</div><div class="empty" style="grid-column:1/-1;">目前沒有資料</div>`;
    return;
  }
  surveyStatusList.innerHTML = `<div class="survey-status-heading">${title}（${rows.length} 人）</div>` + rows.map(row => {
    const response = row.response;
    const pass = response && response.part1_result === "合格" && response.part2_result === "合格";
    const resultText = !response ? "尚未提交問卷" : `第一部分：${response.part1_result || "未判定"}｜第二部分：${response.part2_result || "未判定"}`;
    const meta = !response ? `${esc(row.round)}｜尚未完成` : `完成日期：${esc(fmt(response.submitted_at))}｜${esc(response.part1_total ?? "-")} 分／${esc(response.part2_total ?? "-")} 分`;
    const tag = !response ? "未完成" : (pass ? "已完成" : "不合格");
    const tagClass = !response || !pass ? "status-fail" : "status-pass";
    const deleteButton = response ? `<button type="button" class="status-delete-btn survey-status-delete" data-id="${esc(response.id || "")}" data-name="${esc(response.respondent_name || row.name)}" data-submitted-at="${esc(response.submitted_at || "")}">刪除紀錄</button>` : "";
    return `<div class="survey-status-card" data-survey-detail-name="${esc(row.name)}">
      <div class="status-name">${esc(row.name)}</div>
      <div class="status-meta">${meta}</div>
      <div class="status-result ${tagClass}">${tag}｜${esc(resultText)}</div>
      ${deleteButton ? `<div class="status-card-actions">${deleteButton}</div>` : ""}
    </div>`;
  }).join("");
}

function renderSurveyResponses(){

async function deleteSurveyResponse(id, name, submittedAt){

    || surveyResponses.find(item => String(item.respondent_name || "") === String(name || "") && String(item.submitted_at || "") === String(submittedAt || ""));

  const displayName = row.respondent_name || "未填姓名";

  try{
    let query = db.from("driver_survey_responses").delete();
    if(row.id){
      query = query.eq("id", row.id);
    }else{
      query = query.eq("respondent_name", row.respondent_name).eq("submitted_at", row.submitted_at);

}

function renderDefensiveStatusList(status){
  activeDefensiveStatus = status || "required";
  const responseMap = latestDefensiveResponseByName();
  const keyword = defensiveSearchInput ? defensiveSearchInput.value.trim().toLowerCase() : "";
  const allRows = defensiveTargets.map(name => ({name, response: responseMap.get(String(name).trim()) || null}));
  const filteredRows = allRows.filter(row => !keyword || row.name.toLowerCase().includes(keyword));
  let rows = filteredRows;
  let title = "應完成名單";
  if(activeDefensiveStatus === "completed"){
    rows = filteredRows.filter(row => row.response?.status === "completed");
    title = "已完成名單";
  }else if(activeDefensiveStatus === "incomplete"){
    rows = filteredRows.filter(row => row.response?.status !== "completed");
    title = "未完成名單";
  }else if(activeDefensiveStatus === "active"){
    title = "在職名單";
  }
  defensiveAdminList.className = "survey-status-list";
  if(!rows.length){
    defensiveAdminList.innerHTML = `<div class="survey-status-heading">${title}（0 人）</div><div class="empty">目前沒有資料</div>`;
    return;
  }
  defensiveAdminList.innerHTML = `<div class="survey-status-heading">${title}（${rows.length} 人）</div>` + rows.map(row => {
    const response = row.response;
    const completed = response?.status === "completed";
    const meta = completed
      ? `完成日期：${esc(fmt(response.completed_at))}｜答題 ${esc(response.attempt_count || 0)} 次`
      : (response ? `尚未完成｜最後作答：${esc(fmt(response.last_attempt_at))}` : "尚未開始");
    const deleteButton = activeDefensiveStatus === "active"
      ? `<button type="button" class="status-delete-btn defensive-target-delete" data-name="${esc(row.name)}" data-round="${esc(surveyRoundSelect.value)}">永久刪除</button>`
      : (completed ? `<button type="button" class="status-delete-btn defensive-status-delete" data-name="${esc(row.name)}" data-month="${esc(response.month_no)}" data-year="${esc(response.training_year)}">刪除紀錄</button>` : "");
    return `<div class="survey-status-card">
      <div class="status-name">${esc(row.name)}</div>
      <div class="status-meta">${activeDefensiveStatus === "active" ? `${esc(surveyRoundSelect.value)}｜在職人員` : meta}</div>
      <div class="status-result ${completed ? "status-pass" : "status-fail"}">${activeDefensiveStatus === "active" ? (completed ? "本月已完成" : "本月未完成") : (completed ? "已完成" : "未完成")}</div>
      ${deleteButton ? `<div class="status-card-actions">${deleteButton}</div>` : ""}
    </div>`;
  }).join("");
}

function batteryKey(value){
  return String(value || "").trim().toLowerCase();
}

function batteryReportPending(row){
  return row && row.resolution_status !== "resolved";
}

function batteryInventoryMap(){
  return new Map((batteryInventory || []).map(row => [batteryKey(row.battery_number), row]));
}

function renderBatterySummary(){
  const activeRows = (batteryInventory || []).filter(row => row.status === "active");
  const activeKeys = new Set(activeRows.map(row => batteryKey(row.battery_number)).filter(Boolean));
  const abnormalKeys = new Set([
    ...activeRows.filter(row => row.health_status === "abnormal").map(row => batteryKey(row.battery_number)),
    ...(batteryReports || [])
      .filter(row => batteryReportPending(row) && activeKeys.has(batteryKey(row.battery_number)))
      .map(row => batteryKey(row.battery_number))
  ].filter(Boolean));
  const total = activeRows.length;
  const abnormal = abnormalKeys.size;
  const normal = Math.max(total - abnormal, 0);
  batterySummary.innerHTML = `
    <div class="summary-card"><div class="summary-label">總數量</div><div class="summary-number">${total}</div></div>
    <div class="summary-card done"><div class="summary-label">正常</div><div class="summary-number">${normal}</div></div>
    <div class="summary-card abnormal"><div class="summary-label">異常</div><div class="summary-number">${abnormal}</div></div>
  `;
}

function latestDeviceReport(reports, key, value){
  const matches = (reports || []).filter(row => batteryKey(row[key]) === batteryKey(value));
  return matches.sort((a,b) => String(b.reported_at || "").localeCompare(String(a.reported_at || "")))[0] || null;
}

function renderBatteryReports(){
  const keyword = batterySearchInput.value.trim().toLowerCase();
  const inventoryMap = batteryInventoryMap();
  const inventoryRows = (batteryInventory || []).map(row => ({
    kind: "inventory",
    row,
    report: latestDeviceReport(batteryReports, "battery_number", row.battery_number)
  }));
  const known = new Set((batteryInventory || []).map(row => batteryKey(row.battery_number)));
  const reportOnlyRows = (batteryReports || [])
    .filter(row => !known.has(batteryKey(row.battery_number)))
    .map(row => ({kind:"report", row, report:row}));
  const rows = [...inventoryRows, ...reportOnlyRows].filter(item => {
    const row = item.row;
    const report = item.report;
    if(!keyword) return true;
    return [row.battery_number, row.restaurant_no, row.issue_description, report?.issue_description]
      .filter(Boolean).some(value => String(value).toLowerCase().includes(keyword));
  });

  if(!rows.length){
    batteryReportList.innerHTML = '<div class="empty">目前沒有電池建檔資料或異常回報</div>';
    return;
  }

  batteryReportList.innerHTML = rows.map(item => {
    const row = item.row;
    const report = item.report;
    const inventory = item.kind === "inventory" ? row : inventoryMap.get(batteryKey(row.battery_number));
    const pending = report && batteryReportPending(report);
    const scrapped = inventory?.status === "scrapped" || report?.resolution_note === "報廢";
    const abnormal = inventory?.health_status === "abnormal";
    const statusText = scrapped ? "已報廢" : pending ? "待處理" : abnormal ? "異常" : report ? "維修完成" : "正常";
    const statusClass = scrapped || pending || abnormal ? "survey-result-fail" : "survey-result-pass";
    const actions = pending ? `
      <button class="action-btn battery-repair-btn" type="button" data-id="${esc(report.id)}">🔧 維修完成</button>
      <button class="action-btn danger battery-scrap-btn" type="button" data-id="${esc(report.id)}">🗑 報廢</button>
    ` : "";
    const issueText = report?.issue_description || row.health_note || "目前沒有異常回報";
    return `
      <div class="survey-card">
        <div class="survey-card-top">
          <div class="survey-name">🔋 ${esc(row.battery_number || "未填編號")}</div>
          <div class="survey-time">建檔：${esc(fmt(inventory?.created_at))}</div>
        </div>
        <div class="survey-grid">
          <div class="survey-item">所在餐廳<strong>${esc(row.restaurant_no || inventory?.restaurant_no || "未填寫")}</strong></div>
          <div class="survey-item">設備狀態<strong class="${statusClass}">${statusText}</strong></div>
        </div>
        <div class="survey-detail"><strong>異常內容：</strong>${esc(issueText)}</div>
        ${report ? `<div class="survey-detail"><strong>回報時間：</strong>${esc(fmt(report.reported_at))}</div>` : ""}
        ${report?.resolution_note ? `<div class="survey-detail"><strong>處理備註：</strong>${esc(report.resolution_note)}</div>` : ""}
        ${actions ? `<div class="record-actions">${actions}</div>` : ""}
      </div>
    `;
  }).join("");
}

function recorderKey(value){
  return String(value || "").trim().toLowerCase();
}

function recorderReportPending(row){
  return row && row.resolution_status !== "resolved";
}

function renderRecorderSummary(){
  const active = recorderInventory.filter(row => row.status === "active");
  const activeKeys = new Set(active.map(row => recorderKey(row.recorder_number)).filter(Boolean));
  const abnormalKeys = new Set([
    ...active.filter(row => row.health_status === "abnormal").map(row => recorderKey(row.recorder_number)),
    ...recorderReports.filter(row => recorderReportPending(row) && activeKeys.has(recorderKey(row.recorder_number))).map(row => recorderKey(row.recorder_number))
  ].filter(Boolean));
  const total = active.length;
  const abnormal = abnormalKeys.size;
  const normal = Math.max(total - abnormal, 0);
  batterySummary.innerHTML = `
    <div class="summary-card"><div class="summary-label">總數量</div><div class="summary-number">${total}</div></div>
    <div class="summary-card done"><div class="summary-label">正常</div><div class="summary-number">${normal}</div></div>
    <div class="summary-card abnormal"><div class="summary-label">異常</div><div class="summary-number">${abnormal}</div></div>`;
}

function renderRecorderReports(){
  const keyword = batterySearchInput.value.trim().toLowerCase();
  const inventoryRows = (recorderInventory || []).map(row => ({
    kind: "inventory",
    row,
    report: latestDeviceReport(recorderReports, "recorder_number", row.recorder_number)
  }));
  const known = new Set((recorderInventory || []).map(row => recorderKey(row.recorder_number)));
  const reportOnlyRows = (recorderReports || [])
    .filter(row => !known.has(recorderKey(row.recorder_number)))
    .map(row => ({kind:"report", row, report:row}));
  const rows = [...inventoryRows, ...reportOnlyRows].filter(item => {
    const row = item.row;
    const report = item.report;
    if(!keyword) return true;
    return [row.recorder_number, row.recorder_size, row.issue_description, report?.issue_description]
      .filter(Boolean).some(value => String(value).toLowerCase().includes(keyword));
  });
  if(!rows.length){ batteryReportList.innerHTML = '<div class="empty">目前沒有紀錄器建檔資料或異常回報</div>'; return; }
  batteryReportList.innerHTML = rows.map(item => {
    const row = item.row;
    const report = item.report;
    const inv = item.kind === "inventory" ? row : null;
    const pending = report && recorderReportPending(report);
    const scrapped = inv?.status === "scrapped" || report?.resolution_note === "報廢";
    const abnormal = inv?.health_status === "abnormal";
    const statusText = scrapped ? "已報廢" : pending ? "待處理" : abnormal ? "異常" : report ? "維修完成" : "正常";
    const statusClass = scrapped || pending || abnormal ? "survey-result-fail" : "survey-result-pass";
    const actions = pending ? `<button class="action-btn recorder-repair-btn" type="button" data-id="${esc(report.id)}">🔧 維修完成</button><button class="action-btn danger recorder-scrap-btn" type="button" data-id="${esc(report.id)}">🗑 報廢</button>` : "";
    return `<div class="survey-card">
      <div class="survey-card-top"><div class="survey-name">📹 ${esc(row.recorder_number || "未填編號")}</div><div class="survey-time">建檔：${esc(fmt(inv?.created_at))}</div></div>
      <div class="survey-grid"><div class="survey-item">紀錄器類型<strong>${inv?.recorder_size === "large" ? "大台" : "小台"}</strong></div><div class="survey-item">設備狀態<strong class="${statusClass}">${statusText}</strong></div></div>
      <div class="survey-detail"><strong>異常內容：</strong>${esc(report?.issue_description || row.health_note || "目前沒有異常回報")}</div>
      ${report ? `<div class="survey-detail"><strong>回報時間：</strong>${esc(fmt(report.reported_at))}</div>` : ""}
      ${report?.resolution_note ? `<div class="survey-detail"><strong>處理備註：</strong>${esc(report.resolution_note)}</div>` : ""}
      ${actions ? `<div class="record-actions">${actions}</div>` : ""}</div>`;
  }).join("");
}

async function loadRecorderData(){
  batteryReportList.innerHTML = '<div class="loading">載入紀錄器資料中…</div>';
  try{
    const [ir,rr] = await Promise.all([db.from("recorders").select("*").order("created_at",{ascending:false}),db.from("recorder_issue_reports").select("*").order("reported_at",{ascending:false})]);
    if(ir.error) throw ir.error; if(rr.error) throw rr.error;
    recorderInventory = ir.data || []; recorderReports = rr.data || [];
    renderRecorderSummary(); renderRecorderReports();
  }catch(e){
    recorderInventory=[]; recorderReports=[]; batterySummary.innerHTML=`<div class="empty" style="grid-column:1/-1">紀錄器資料讀取失敗：${esc(e.message || "請先執行 recorders 建表 SQL")}</div>`; batteryReportList.innerHTML=`<div class="empty">紀錄器資料讀取失敗：${esc(e.message || "請確認資料表與權限")}</div>`;
  }
}

function currentDeviceLabel(){
  return deviceAdminType.value === "recorder" ? "紀錄器" : "電池";
}

function currentDeviceTable(){
  return deviceAdminType.value === "recorder" ? "recorders" : "batteries";
}

function currentDeviceInventory(){
  return deviceAdminType.value === "recorder" ? (recorderInventory || []) : (batteryInventory || []);
}

function filteredCurrentDeviceInventory(){
  const keyword = batterySearchInput.value.trim().toLowerCase();
  return currentDeviceInventory().filter(row => {
    if(!keyword) return true;
    const values = deviceAdminType.value === "recorder"
      ? [row.recorder_number, row.recorder_size, row.health_note]
      : [row.battery_number, row.restaurant_no, row.health_note];
    return values.filter(Boolean).some(value => String(value).toLowerCase().includes(keyword));
  });
}

}

async function addDeviceFromAdmin(){
  const type = deviceAdminType.value;
  const number = batterySearchInput.value.trim();
  if(!number){
    deviceSearchMessage.textContent = `請先輸入${type === "recorder" ? "紀錄器" : "電池"}編號。`;
    batterySearchInput.focus();
    return;
  }
  if(type === "battery" && !deviceRegisterRestaurant.value){
    deviceRegisterMessage.textContent = "請選擇電池所在餐廳。";
    deviceRegisterRestaurant.focus();
    return;
  }
  deviceRegisterBtn.disabled = true;
  deviceRegisterMessage.textContent = "新增正常設備中…";
  try{
    const table = type === "battery" ? "batteries" : "recorders";
    const payload = type === "battery"
      ? {battery_number:number, restaurant_no:deviceRegisterRestaurant.value, status:"active", health_status:"normal", health_note:null}
      : {recorder_number:number, recorder_size:deviceRegisterSize.value, status:"active", health_status:"normal", health_note:null};
    const result = await db.from(table).insert(payload).select().single();
    if(result.error){
      if(result.error.code === "23505") throw new Error("此設備編號已完成建檔，請重新查詢。");
      throw result.error;
    }
    deviceRegisterMessage.textContent = `✅ ${type === "battery" ? "電池" : "紀錄器"} ${number} 已新增為正常設備。`;
    if(type === "battery") deviceRegisterRestaurant.value = "";
    await loadDeviceData(false);
  }catch(e){
    deviceRegisterMessage.textContent = `新增失敗：${e.message || "請確認權限"}`;
  }finally{
    deviceRegisterBtn.disabled = false;
  }
}

async function updateRecorderIssue(id, action){
  const row = recorderReports.find(item => String(item.id) === String(id)); if(!row || !recorderReportPending(row)) return;
  const scrap = action === "scrapped"; const label = scrap ? "報廢" : "維修完成";
  if(!confirm(`確定要將紀錄器「${row.recorder_number || "未填編號"}」標記為「${label}」嗎？`)) return;
  try{
    const inv = recorderInventory.find(item => recorderKey(item.recorder_number) === recorderKey(row.recorder_number));
    if(!inv) throw new Error("找不到此紀錄器建檔資料。");
    const now = new Date().toISOString();
    const ur = await db.from("recorders").update({status:scrap ? "scrapped" : "active",health_status:scrap ? "abnormal" : "normal",health_note:scrap ? "報廢" : null,...(scrap ? {scrapped_at:now,scrapped_note:"由異常回報標記報廢"} : {})}).eq("id",inv.id);
    if(ur.error) throw ur.error;
    const rr = await db.from("recorder_issue_reports").update({resolution_status:"resolved",resolved_at:now,resolution_note:label}).eq("recorder_number",row.recorder_number).neq("resolution_status","resolved");
    if(rr.error) throw rr.error;
    alert(`✅ 已完成：${label}`); await loadRecorderData();
  }catch(e){ alert(`紀錄器處理失敗：${e.message || "未知錯誤"}`); }
}

function exportRecorderReports(){
  if(!recorderReports.length){ alert("目前沒有可匯出的紀錄器異常資料。"); return; }
  const map = new Map(recorderInventory.map(row => [recorderKey(row.recorder_number),row]));
  const rows = recorderReports.map(row => ({紀錄器編號:row.recorder_number || "",類型:map.get(recorderKey(row.recorder_number))?.recorder_size === "large" ? "大台" : "小台",異常內容:row.issue_description || "",回報時間:row.reported_at || "",處理狀態:row.resolution_status === "resolved" ? (row.resolution_note === "報廢" ? "已報廢" : "維修完成") : "待處理",處理時間:row.resolved_at || "",處理備註:row.resolution_note || ""}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"紀錄器異常回報"); XLSX.writeFile(wb,`KFC_紀錄器異常_${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function loadBatteryData(){
  batteryReportList.innerHTML = '<div class="loading">載入電池資料中…</div>';
  try{
    const [inventoryResult, reportResult] = await Promise.all([
      db.from("batteries").select("*").order("created_at",{ascending:false}),
      db.from("battery_issue_reports").select("*").order("reported_at",{ascending:false})
    ]);
    if(inventoryResult.error) throw inventoryResult.error;
    if(reportResult.error) throw reportResult.error;
    batteryInventory = inventoryResult.data || [];
    batteryReports = reportResult.data || [];
    renderBatterySummary();
    renderBatteryReports();
  }
  catch(e){
    batteryInventory = [];
    batteryReports = [];
    batterySummary.innerHTML = `
      <div class="empty" style="grid-column:1/-1">電池建檔資料讀取失敗：${esc(e.message || "請先執行 batteries 建表 SQL")}</div>
    `;
    batteryReportList.innerHTML = `<div class="empty">電池資料讀取失敗：${esc(e.message || "請確認資料表與權限")}</div>`;
  }
}

async function updateBatteryIssue(id, action){
  const row = batteryReports.find(item => String(item.id || "") === String(id || ""));
  if(!row || !batteryReportPending(row)) return;
  const isScrap = action === "scrapped";
  const label = isScrap ? "報廢" : "維修完成";
  if(!confirm(`確定要將電池「${row.battery_number || "未填編號"}」標記為「${label}」嗎？`)) return;
  try{
    if(isScrap){
      const inventory = batteryInventory.find(item => batteryKey(item.battery_number) === batteryKey(row.battery_number) && item.status === "active");
      if(!inventory){
        throw new Error("找不到此電池的使用中建檔資料，請先完成電池建檔。");
      }
      const inventoryResult = await db.from("batteries").update({status:"scrapped", scrapped_at:new Date().toISOString(), scrapped_note:"由異常回報標記報廢"}).eq("id", inventory.id);
      if(inventoryResult.error) throw inventoryResult.error;
    }
    const reportResult = await db.from("battery_issue_reports").update({resolution_status:"resolved", resolved_at:new Date().toISOString(), resolution_note:label}).eq("battery_number", row.battery_number).neq("resolution_status","resolved");
    if(!reportResult.error && !isScrap){
      await db.from("batteries").update({health_status:"normal", health_note:null}).eq("battery_number", row.battery_number).eq("status","active");
    }
    if(reportResult.error) throw reportResult.error;
    alert(`✅ 已完成：${label}`);
    await loadBatteryData();
  }catch(e){
    alert(`電池處理失敗：${e.message || "未知錯誤"}`);
  }
}

function exportBatteryReports(){
  if(!batteryReports.length){
    alert("目前沒有可匯出的電池異常資料。");
    return;
  }
  const rows = batteryReports.map(row => ({
    id: row.id || "",
    電池編號: row.battery_number || "",
    所在餐廳: row.restaurant_no || "",
    異常內容: row.issue_description || "",
    回報時間: row.reported_at || "",
    處理狀態: row.resolution_status || "",
    處理完成時間: row.resolved_at || "",
    處理備註: row.resolution_note || ""
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, "電池異常回報");
  XLSX.writeFile(wb, `KFC_電池異常回報_${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function deleteBatteryReport(id){
  const row = batteryReports.find(item => String(item.id || "") === String(id || ""));
  if(!row) return;
  if(!confirm(`確定要刪除電池「${row.battery_number || "未填編號"}」的這筆異常回報嗎？\n\n刪除後無法復原。`)) return;
  try{
    const result = await db.from("battery_issue_reports").delete().eq("id", id);
    if(result.error) throw result.error;
    batteryReports = batteryReports.filter(item => String(item.id || "") !== String(id || ""));
    renderBatterySummary();
    renderBatteryReports();
    alert("✅ 電池異常回報已刪除。");
  }catch(e){
    alert(`刪除電池異常回報失敗：${e.message || "請確認 Supabase DELETE 權限"}`);
  }
}

async function searchCurrentDeviceByNumber(){
  const keyword = batterySearchInput.value.trim();
  if(!keyword){
    if(deviceAdminType.value === "recorder") renderRecorderReports(); else renderBatteryReports();
    syncDeviceSearchState();
    return;
  }
  const token = ++deviceSearchToken;
  const recorder = deviceAdminType.value === "recorder";
  const table = recorder ? "recorders" : "batteries";
  const column = recorder ? "recorder_number" : "battery_number";
  deviceRegisterPanel.style.display = "none";
  deviceSearchMessage.textContent = `正在查詢${currentDeviceLabel()}…`;
  try{
    const result = await db.from(table).select("*").eq(column, keyword).maybeSingle();
    if(token !== deviceSearchToken || keyword !== batterySearchInput.value.trim()) return;
    if(result.error) throw result.error;
    if(result.data){
      if(recorder){
        recorderInventory = [...recorderInventory.filter(row => String(row.id) !== String(result.data.id)), result.data];
        renderRecorderReports();
      }else{
        batteryInventory = [...batteryInventory.filter(row => String(row.id) !== String(result.data.id)), result.data];
        renderBatteryReports();
      }
      deviceRegisterPanel.style.display = "none";
      deviceSearchMessage.textContent = `已找到 1 筆${currentDeviceLabel()}設備，已顯示設備小卡。`;
      return;
    }
    if(recorder) renderRecorderReports(); else renderBatteryReports();
    deviceRegisterPanel.style.display = "block";
    deviceRegisterMessage.textContent = `查無此${currentDeviceLabel()}，請確認編號後新增正常設備。`;
    deviceSearchMessage.textContent = `查無此${currentDeviceLabel()}，可直接新增正常設備。`;
  }catch(error){
    if(token !== deviceSearchToken) return;
    console.error(error);
    deviceSearchMessage.textContent = `設備查詢失敗：${error.message || "請稍後再試"}`;
  }
}

/* =========================
   管理員登入
========================= */
const authGate = document.getElementById("authGate");
const authForm = document.getElementById("authForm");
const authEmailInput = document.getElementById("authEmail");
const authPasswordInput = document.getElementById("authPassword");
const authPasswordToggle = document.getElementById("authPasswordToggle");
const authSubmit = document.getElementById("authSubmit");
const authMessage = document.getElementById("authMessage");
const adminApp = document.getElementById("adminApp");
const adminSessionBar = document.getElementById("adminSessionBar");
const adminSessionEmail = document.getElementById("adminSessionEmail");
const authLogoutBtn = document.getElementById("authLogoutBtn");
let authBusy = false;

function showAuthMessage(message, success=false){
  authMessage.textContent = message || "";
  authMessage.style.color = success ? "var(--green)" : "var(--danger)";
}

function lockAdmin(message=""){ 
  authGate.style.display = "flex";
  adminApp.style.display = "none";
  adminSessionBar.style.display = "none";
  showAuthMessage(message);
}

async function unlockAdmin(session){
  if(!session?.user?.email){ lockAdmin(); return; }
  const email = String(session.user.email).trim().toLowerCase();
  const allow = await db.from("admin_allowlist").select("email").ilike("email", email).eq("active", true).maybeSingle();
  if(allow.error){
    await db.auth.signOut();
    lockAdmin("管理員白名單尚未設定，請先執行 T998 管理員 SQL。");
    return;
  }
  if(!allow.data){
    await db.auth.signOut();
    lockAdmin("此帳號尚未授權使用本區後台。");
    return;
  }
  authGate.style.display = "none";
  adminApp.style.display = "block";
  adminSessionBar.style.display = "flex";
  adminSessionEmail.textContent = `已登入：${email}`;
  showAuthMessage("", true);
  showAdminMode("home");
}

authPasswordToggle.onclick = () => {
  const visible = authPasswordInput.type === "text";
  authPasswordInput.type = visible ? "password" : "text";
  authPasswordToggle.textContent = visible ? "顯示" : "隱藏";
};

authForm.onsubmit = async event => {
  event.preventDefault();
  if(authBusy) return;
  authBusy = true;
  authSubmit.disabled = true;
  authSubmit.textContent = "登入中…";
  showAuthMessage("");
  try{
    const result = await db.auth.signInWithPassword({email:authEmailInput.value.trim(),password:authPasswordInput.value});
    if(result.error){
      showAuthMessage("登入失敗，請確認帳號與密碼。", false);
    }else{
      await unlockAdmin(result.data.session);
    }
  }catch(error){
    console.error(error);
    showAuthMessage("登入服務暫時無法使用，請稍後再試。", false);
  }finally{
    authBusy = false;
    authSubmit.disabled = false;
    authSubmit.textContent = "登入後台";
  }
};

authLogoutBtn.onclick = async () => {
  await db.auth.signOut();
  authPasswordInput.value = "";
  lockAdmin("已安全登出。");
};

db.auth.onAuthStateChange((_event, session) => {
  setTimeout(() => unlockAdmin(session).catch(() => lockAdmin("登入狀態檢查失敗，請重新登入。")), 0);
});

db.auth.getSession().then(({data}) => unlockAdmin(data.session)).catch(() => lockAdmin("登入狀態讀取失敗，請重新登入。"));


showAdminMode("home");

</script>
